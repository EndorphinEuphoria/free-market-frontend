<div style="max-width: 480px; width: 100%;">

  <div class="mb-4">
    <h1 class="form-title">Forgot your password?</h1>
    <p class="text-muted small mb-0">Enter your email so that we can send you a password reset link.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    <div class="mb-3">
      <label class="form-label small fw-semibold">Email</label>
      <div class="input-wrapper" [class.is-invalid-wrapper]="email.invalid && email.touched">
        <svg class="input-icon" viewBox="0 0 20 20" fill="none">
          <path d="M2.5 6.667A1.667 1.667 0 0 1 4.167 5h11.666A1.667 1.667 0 0 1 17.5 6.667v6.666A1.667 1.667 0 0 1 15.833 15H4.167A1.667 1.667 0 0 1 2.5 13.333V6.667Z" stroke="currentColor" stroke-width="1.25"/>
          <path d="m2.5 6.667 7.5 5 7.5-5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
        <input
          type="email"
          formControlName="email"
          placeholder="e.g. username@email.com"
          autocomplete="email"
          class="custom-input"
        />
      </div>
      @if (email.touched && email.hasError('required')) {
        <div class="invalid-feedback d-block">Email is required</div>
      } @else if (email.touched && email.hasError('email')) {
        <div class="invalid-feedback d-block">Enter a valid email</div>
      }
    </div>

    @if (serverError()) {
      <div class="alert alert-danger py-2 px-3 small" role="alert">{{ serverError() }}</div>
    }

    <button type="submit"
      class="btn btn-primary w-100 mt-1 d-flex align-items-center justify-content-center gap-2"
      [disabled]="isLoading()">
      @if (isLoading()) {
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        Sending…
      } @else {
        Send Email
      }
    </button>

    <div class="text-center mt-3">
      <a routerLink="/login" class="brand-link small">← Back to Log In</a>
    </div>

  </form>

</div>
