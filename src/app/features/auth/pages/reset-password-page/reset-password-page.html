<div class="auth-page">

  <div class="auth-brand">
    @if (configService.logoUrl()) {
      <img [src]="configService.logoUrl()" alt="logo" class="auth-brand__logo" />
    }
    @if (configService.commerceName()) {
      <span class="auth-brand__name">{{ configService.commerceName() }}</span>
    } @else {
      <span class="spinner-border spinner-border-sm" role="status"></span>
    }
  </div>

  <div class="auth-card">
    <app-reset-password-form />
  </div>

</div>
