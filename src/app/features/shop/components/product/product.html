<div class="product-card">

  <!-- Imagen + acciones hover -->
  <div class="card-img-wrap">
    <img
      [src]="product().imageUrl || 'https://placehold.co/400x400?text=Product'"
      [alt]="product().name"
      class="card-img"
    />

    <!-- Badge de descuento o novedad -->
    <span *ngIf="product().badge" class="card-badge">{{ product().badge }}</span>

    <!-- Botón favorito -->
    <button class="btn-fav" (click)="onToggleFavorite($event)" aria-label="Favorito">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682
                 a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318
                 a4.5 4.5 0 00-6.364 0z"/>
      </svg>
    </button>

    <!-- Botón add-to-cart visible on hover -->
    <button class="btn-add-cart" (click)="onAddToCart($event)">
      Agregar al carrito
    </button>
  </div>

  <!-- Contenido -->
  <div class="card-body">
    <p class="card-category">{{ product().category }}</p>
    <h3 class="card-name">{{ product().name }}</h3>

    <!-- Estrellas -->
    <div class="card-stars">
      <svg *ngFor="let s of stars; let i = index"
           xmlns="http://www.w3.org/2000/svg" width="14" height="14"
           viewBox="0 0 24 24"
           [attr.fill]="i < (product().rating ?? 0) ? '#FBBF24' : '#E5E7EB'"
           [attr.stroke]="i < (product().rating ?? 0) ? '#FBBF24' : '#E5E7EB'"
           stroke-width="1">
        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
      </svg>
      <span class="card-reviews">({{ product().reviewCount ?? 0 }})</span>
    </div>

    <!-- Precio -->
    <div class="card-price-row">
      <span class="card-price">${{ product().price.toFixed(2) }}</span>
      <span *ngIf="product().originalPrice" class="card-original">
        ${{ product().originalPrice!.toFixed(2) }}
      </span>
    </div>
  </div>

</div>
