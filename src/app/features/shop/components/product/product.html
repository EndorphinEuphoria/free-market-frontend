<div class="product-card">

  <!-- Imagen + acciones hover -->
  <div class="card-img-wrap">
    <img
      [src]="product().url || 'https://placehold.co/400x400?text=Product'"
      class="card-img"
    />

    <!-- Botón add-to-cart visible on hover -->
    <button class="btn-add-cart" (click)="onAddToCart($event)">
      Agregar al carrito
    </button>
  </div>

  <!-- Contenido -->
  <div class="card-body">
    <p class="card-category">{{ product().proovedorNombre }}</p>
    <h3 class="card-name">{{ product().name }}</h3>

    <!-- Precio -->
    <div class="card-price-row">
      <span class="card-price">${{ product().price | clpFormat }}</span>
    </div>
  </div>

</div>
