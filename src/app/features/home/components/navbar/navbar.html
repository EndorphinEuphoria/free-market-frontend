<nav class="navbar navbar-expand-lg" [class.navbar--scrolled]="isScrolled()">
  <div class="container-fluid px-4">

    <!-- Brand -->
    <a class="navbar-brand brand-name d-flex align-items-center gap-2" routerLink="/home">
  @if (configService.logoUrl()) {
    <img [src]="configService.logoUrl()" alt="logo" class="navbar-logo" />
  }
  @if (configService.commerceName()) {
    {{ configService.commerceName() }}
  } @else {
    <span class="spinner-border spinner-border-sm" role="status"></span>
  }
</a>
    <!-- Mobile toggle -->
    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible section — Bootstrap collapse class needed -->
    <div class="navbar-collapse" [class.show]="isMobileMenuOpen()">

      <!-- Nav links — centered -->
      <ul class="navbar-nav mx-auto gap-1 mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="nav-link--active"
            [routerLinkActiveOptions]="{exact:true}">Home</a>
        </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/shop" routerLinkActive="nav-link--active">All products</a>
          </li>
      </ul>

      <!-- Right actions -->
      <div class="d-flex align-items-center gap-3">
      @if (router.url.startsWith('/shop')) {
          <button class="icon-btn" aria-label="Carrito" (click)="openCart()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M6 2 3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor" stroke-width="1.5"/>
              <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            @if (cartService.totalItems() > 0) {
              <span class="cart-badge">{{ cartService.totalItems() }}</span>
            }
          </button>
      }
        
           <!-- Search -->
          <button class="icon-btn hidden-btn" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        @if (auth.isLoggedIn()) {
  <div class="user-dropdown-wrap">
    <button class="nav-user-name" (click)="toggleUserMenu(); $event.stopPropagation()">
      {{ auth.currentUser()?.username }}
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
        [style.transform]="isUserMenuOpen() ? 'rotate(180deg)' : 'rotate(0)'"
        style="transition: transform 0.2s">
        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    @if (isUserMenuOpen()) {
      <div class="user-dropdown">
        <a class="user-dropdown-item" routerLink="/profile" (click)="isUserMenuOpen.set(false)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Edit profile
        </a>
        <a class="user-dropdown-item" routerLink="/orders" (click)="isUserMenuOpen.set(false)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke="currentColor" stroke-width="1.5"/>
            <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          My orders
        </a>
        <div class="user-dropdown-divider"></div>
        <button class="user-dropdown-item user-dropdown-item--danger"
          (click)="auth.logout(); isUserMenuOpen.set(false)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Logout
        </button>
      </div>
    }
  </div>
} @else {
  <a routerLink="/login" class="nav-action-link d-flex align-items-center gap-1">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>Login / Register</span>
  </a>
}

        

      </div>
    </div>
  </div>
</nav>
